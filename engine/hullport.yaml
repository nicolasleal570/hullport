# Lima configuration for the Hullport engine VM.
# scripts/engine.sh renders it into $HULLPORT_HOME/hullport.yaml, replacing the @NAME@ placeholders
# with values from engine/versions.toml. {{...}} placeholders are Lima's own and stay as they are.

minimumLimaVersion: 2.3.0

# Apple's Virtualization framework: no QEMU, no firmware files, no sudo.
vmType: vz
cpus: 4
memory: 8GiB
# Root disk: Ubuntu only. Images, containers and volumes live on the hullport-data disk below,
# so the base image can be replaced without losing them. Both disks are sparse files.
disk: 16GiB

images:
- location: "@GUEST_IMAGE_PATH@"
  arch: aarch64
  digest: "sha256:@GUEST_IMAGE_SHA256@"

# The whole home folder, read-write, over virtiofs. Lima mounts it at the same path in the VM,
# so `docker run -v $PWD:/app` works unchanged from the Mac.
mountType: virtiofs
mounts:
- location: "~"
  writable: true
# virtiofs doesn't carry file-change events from the Mac into the VM. Lima's experimental
# mountInotify watches the Mac side and touches the changed file inside the VM instead.
mountInotify: true

# Created once with `limactl disk create`; it outlives the VM.
additionalDisks:
- name: hullport-data
  format: true
  fsType: ext4
  mountPoint: /mnt/hullport-data

# containerd is managed by Docker here, not by Lima.
containerd:
  system: false
  user: false

# Lima runs these on every boot, after the data disk is mounted.
provision:
- mode: system
  script: |
    #!/bin/bash
    set -eux -o pipefail
    # Keep Docker's and containerd's data on the persistent disk. Docker 29 stores images in
    # containerd's directory, so both are needed.
    for d in docker containerd; do
      mkdir -p "/mnt/hullport-data/$d" "/var/lib/$d"
      mountpoint -q "/var/lib/$d" || mount --bind "/mnt/hullport-data/$d" "/var/lib/$d"
    done
- mode: system
  script: |
    #!/bin/bash
    set -eux -o pipefail
    # Tools such as `supabase start` bind-mount the socket they connect to, by its Mac path,
    # into containers. dockerd resolves that path here in the VM, where the Mac's socket can't
    # cross virtiofs. A tmpfs over the folder, seen only inside the VM, makes the same path
    # lead to the real socket. The Mac's copy of the folder is untouched.
    run="@HULLPORT_HOME@/run"
    mountpoint -q "$run" || mount -t tmpfs -o mode=0755,size=1m hullport-run "$run"
    ln -sfn /var/run/docker.sock "$run/docker.sock"
- mode: system
  script: |
    #!/bin/bash
    set -eux -o pipefail
    want="@GUEST_DOCKER_VERSION@"
    have="$(dpkg-query -W -f='${Version}' docker-ce 2>/dev/null || true)"
    if [ "$have" != "$want" ]; then
      export DEBIAN_FRONTEND=noninteractive
      install -m 0755 -d /etc/apt/keyrings
      curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
      # Docker's release signing key.
      gpg --show-keys --with-colons /etc/apt/keyrings/docker.asc | grep -q '^fpr:::::::::9DC858229FC7DD38854AE2D88D81803C0EBFCD88:'
      echo "deb [arch=arm64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu resolute stable" >/etc/apt/sources.list.d/docker.list
      apt-get update
      apt-get install -y --allow-downgrades \
        "docker-ce=$want" "docker-ce-cli=$want" "containerd.io=@GUEST_CONTAINERD_VERSION@"
      apt-mark hold docker-ce docker-ce-cli containerd.io
    fi
    # Never start before the data disk is bound (see the first script); this script starts them.
    systemctl disable docker.service docker.socket containerd.service
    systemctl daemon-reload
    systemctl start containerd.service docker.socket docker.service
- mode: yq
  path: /etc/systemd/system/docker.socket.d/override.conf
  format: ini
  expression: .Socket.SocketUser="{{.User}}"

probes:
- script: |
    #!/bin/bash
    set -eux -o pipefail
    if ! timeout 120s bash -c "until docker info >/dev/null 2>&1; do sleep 2; done"; then
      echo >&2 "dockerd is not answering"
      exit 1
    fi
  hint: See /var/log/cloud-init-output.log in the guest

hostResolver:
  hosts:
    host.docker.internal: host.lima.internal

# The VM's Docker socket, exposed on the Mac. Lima forwards it over vsock, through its guest agent.
portForwards:
- guestSocket: /var/run/docker.sock
  hostSocket: "@HULLPORT_HOME@/run/docker.sock"
